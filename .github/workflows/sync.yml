name: Sync catalog from uCoz uAPI

on:
  schedule:
    # Off-the-hour offsets (:03,:13,:23…) — GitHub deprioritises schedule events
    # at :00,:10,:20 under peak load and silently skips them. This is a fallback;
    # primary trigger is a Supabase pg_cron job that hits workflow_dispatch.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install --quiet httpx

      - name: Snapshot previous count
        id: prev
        run: |
          # Read scraped_count from the committed catalog (HEAD) before we
          # overwrite the file. Empty string if catalog.json doesn't exist yet.
          if [ -f catalog.json ]; then
            old=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
          else
            old=""
          fi
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Pull catalog
        env:
          UCOZ_SITE: bosminiofficial.com
          UCOZ_TOKEN: ${{ secrets.UCOZ_TOKEN }}
        run: |
          if [ -z "$UCOZ_TOKEN" ]; then
            echo "::error::UCOZ_TOKEN secret is not set"
            exit 1
          fi
          # Retry to ride out transient uAPI 5xx / network blips before paging
          # the operator. Telegram alert fires only after all 3 attempts fail.
          for attempt in 1 2 3; do
            if python sync_catalog.py --out catalog.json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::sync_catalog.py failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 20s…"
            sleep 20
          done

      - name: Sanity check (count not collapsed)
        env:
          OLD: ${{ steps.prev.outputs.old }}
          MIN_RATIO: "0.8"
        run: |
          new=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
          echo "Previous count: ${OLD:-<none>}"
          echo "New count:      $new"
          if [ -z "$OLD" ]; then
            echo "First run — nothing to compare. Accepting."
            exit 0
          fi
          # Refuse to publish if the catalog shrank below MIN_RATIO of the prior
          # snapshot. Guards against partial uAPI failures (one category 5xx'd
          # mid-fetch) leaving us with a half-empty feed in production.
          python - <<PY
          import os, sys
          old = int(os.environ["OLD"])
          new = $new
          ratio = float(os.environ["MIN_RATIO"])
          if old > 0 and new < old * ratio:
              print(f"::error::Catalog collapsed: {new} < {old} * {ratio} ({int(old*ratio)}). Refusing to commit.")
              sys.exit(1)
          print(f"OK — {new} >= {int(old*ratio)} (floor at {ratio:.0%} of previous).")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain catalog.json)" ]; then
            count=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
            git add catalog.json
            git commit -m "Auto-sync catalog (${count} products)"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi
              echo "Push attempt $attempt failed, retrying in 10s…"
              sleep 10
            done
            echo "Committed update."
          else
            echo "No changes — catalog already up to date."
          fi

      - name: Trigger Supabase sync-catalog
        # Chained off the back of the workflow (not pg_cron) so the Edge
        # Function always reads the catalog.json we just committed, not a
        # stale copy from before this run. anon key is intentionally
        # public — sync-catalog uses service_role internally.
        run: |
          # Edge Functions require Authorization: Bearer <jwt>; the apikey
          # header alone is for PostgREST and returns 401 here.
          for attempt in 1 2 3; do
            if curl -fsS -X POST \
                "https://bjcqaltwlblzqdkdujlu.supabase.co/functions/v1/sync-catalog" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqY3FhbHR3bGJsenFka2R1amx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDA0NzcsImV4cCI6MjA5NDc3NjQ3N30.wcQgMgba0OEW0vfDzXfhnC92Aqjd3ZPbBOQ_TGyc1qo" \
                -d '{}'; then
              echo
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::sync-catalog Edge Function failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 10s…"
            sleep 10
          done

      - name: Sync catalog to WooCommerce (.ru)
        # Push the just-committed catalog.json into the bosminiofficial.ru
        # WooCommerce store, incrementally:
        #   --changed-only  push only products whose content-hash changed since
        #                   last run (tracked in woo_state.json) — re-writing all
        #                   449 every 10 min would hammer the reg.ru shared host.
        #   --prune         force-delete products that vanished from the catalog
        #                   (matched by sku=slug, so the client's manual blank-sku
        #                   products are never touched; --max-deletes caps it).
        # Self-skips until WOO_CK/WOO_CS secrets exist, so this can land before
        # the keys are wired. Runs AFTER the catalog commit + Supabase trigger so
        # a reg.ru hiccup never blocks the app's own feed.
        #
        # KNOWN ISSUE (2026-06-01): reg.ru drops TCP connections from GitHub's
        # runner IPs (httpx.ConnectTimeout), so this step can't reach the store
        # from Actions — same block that forced the Timeweb VPS proxy in front of
        # Supabase. Until the push is routed through a Russian-IP proxy/VPS this
        # is continue-on-error + fail-fast (--timeout 20, single attempt): it
        # tries each run but never fails the pipeline or fires the Telegram alert.
        if: ${{ env.WOO_CK != '' && env.WOO_CS != '' }}
        continue-on-error: true
        env:
          WOO_SITE: bosminiofficial.ru
          WOO_CK: ${{ secrets.WOO_CK }}
          WOO_CS: ${{ secrets.WOO_CS }}
        run: |
          python sync_to_woo.py --apply --changed-only --prune --timeout 20

      - name: Commit woo_state if changed
        # woo_state.json only advances for products that pushed OK, so committing
        # it is what lets the next run skip unchanged products instead of
        # re-pushing all 449. always() so a partial/failed WooCommerce sync still
        # persists whatever progress it made (the rest retries next run).
        if: ${{ always() && env.WOO_CK != '' }}
        env:
          WOO_CK: ${{ secrets.WOO_CK }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain woo_state.json)" ]; then
            git add woo_state.json
            git commit -m "Auto-sync woo_state"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::git push (woo_state) failed after 3 attempts"
                exit 1
              fi
              echo "Push attempt $attempt failed, retrying in 10s…"
              sleep 10
            done
            echo "Committed woo_state update."
          else
            echo "woo_state unchanged — store already in sync."
          fi

      - name: Notify Telegram on failure
        # Self-skips when secrets aren't set, so this can land before the user
        # finishes wiring the bot. Once TG_BOT_TOKEN+TG_CHAT_ID exist as repo
        # secrets, any failed run (uAPI 5xx, sanity check trip, token expiry…)
        # pings the chat with a link to the failed run.
        if: ${{ failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="🚨 *BOS·MINI catalog sync FAILED*%0A%0ARepo: ${GITHUB_REPOSITORY}%0ARun: ${RUN_URL}"
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${text}"
