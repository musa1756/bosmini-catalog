name: Sync catalog from uCoz uAPI

on:
  # GitHub Actions is the only timer now (was Supabase pg_cron on the old
  # Frankfurt project). Single timer => no dual-trigger collision.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-catalog
  # GitHub Actions is now the only timer (the old Frankfurt pg_cron is gone),
  # so the dual-trigger collision that once justified `false` can't happen.
  # `true` makes the queue self-heal: a new scheduled run evicts a stuck one
  # instead of queuing behind it and being cancelled itself.
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hard ceiling: a healthy run finishes in ~30s. If the uAPI degrades and a
    # request stalls, fail the run at 10 min rather than let it hold the
    # concurrency lock for GitHub's 6h max and starve every scheduled run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install --quiet httpx

      - name: Snapshot previous count
        id: prev
        run: |
          # Read scraped_count from the committed catalog (HEAD) before we
          # overwrite the file. Empty string if catalog.json doesn't exist yet.
          if [ -f catalog.json ]; then
            old=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
          else
            old=""
          fi
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Pull catalog
        env:
          UCOZ_SITE: bosminiofficial.com
          UCOZ_TOKEN: ${{ secrets.UCOZ_TOKEN }}
        run: |
          if [ -z "$UCOZ_TOKEN" ]; then
            echo "::error::UCOZ_TOKEN secret is not set"
            exit 1
          fi
          # Retry to ride out transient uAPI 5xx / network blips before paging
          # the operator. sync_catalog.py also retries each uAPI request with
          # backoff for 429/5xx/timeouts, so this catches only whole-run errors.
          for attempt in 1 2 3; do
            # Tight per-request timeout + fewer retries so a degraded uAPI
            # fails this attempt fast instead of grinding ~15 min/request
            # (was 60s timeout x 6 retries x 90s backoff).
            if python sync_catalog.py --out catalog.json \
                --timeout 30 --max-retries 3 --retry-max-delay 30; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::sync_catalog.py failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 120s…"
            sleep 120
          done

      - name: Sanity check (count not collapsed)
        env:
          OLD: ${{ steps.prev.outputs.old }}
          MIN_RATIO: "0.8"
        run: |
          new=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
          echo "Previous count: ${OLD:-<none>}"
          echo "New count:      $new"
          if [ -z "$OLD" ]; then
            echo "First run — nothing to compare. Accepting."
            exit 0
          fi
          # Refuse to publish if the catalog shrank below MIN_RATIO of the prior
          # snapshot. Guards against partial uAPI failures (one category 5xx'd
          # mid-fetch) leaving us with a half-empty feed in production.
          python - <<PY
          import os, sys
          old = int(os.environ["OLD"])
          new = $new
          ratio = float(os.environ["MIN_RATIO"])
          if old > 0 and new < old * ratio:
              print(f"::error::Catalog collapsed: {new} < {old} * {ratio} ({int(old*ratio)}). Refusing to commit.")
              sys.exit(1)
          print(f"OK — {new} >= {int(old*ratio)} (floor at {ratio:.0%} of previous).")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          same_catalog_payload_as_origin() {
            python - <<'PY'
          import json
          import subprocess

          with open("catalog.json", encoding="utf-8") as f:
              local = json.load(f)
          remote_raw = subprocess.check_output(["git", "show", "origin/main:catalog.json"])
          remote = json.loads(remote_raw)
          local.pop("generated_at", None)
          remote.pop("generated_at", None)
          raise SystemExit(0 if local == remote else 1)
          PY
          }

          if [ -n "$(git status --porcelain catalog.json)" ]; then
            count=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
            git add catalog.json
            git commit -m "Auto-sync catalog (${count} products)"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              git fetch origin main
              if same_catalog_payload_as_origin; then
                echo "Remote already has the same catalog payload; skipping stale timestamp push."
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi
              echo "Push attempt $attempt failed, rebasing on origin/main and retrying in 10s…"
              git rebase origin/main
              sleep 10
            done
            echo "Committed update."
          else
            echo "No changes — catalog already up to date."
          fi

      - name: Trigger Beget sync-catalog Edge Function
        # Chained off the back of the workflow (not pg_cron) so the Edge
        # Function always reads the catalog.json we just committed, not a
        # stale copy from before this run. Access is gated by the shared
        # X-Sync-Secret header (verify_jwt is off on the function) — the repo
        # secret must equal the function's SYNC_SECRET env.
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS -X POST \
                "https://mujafejeji.beget.app/functions/v1/sync-catalog" \
                -H "Content-Type: application/json" \
                -H "X-Sync-Secret: ${SYNC_SECRET}" \
                -d '{}'; then
              echo
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::sync-catalog Edge Function failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 10s…"
            sleep 10
          done

      # NOTE: the .ru WooCommerce mirror is NOT done here. reg.ru drops TCP
      # connections from GitHub's runner IPs (httpx.ConnectTimeout), so the
      # push runs from the Beget VPS (5.181.108.11, Russian IP) on its own
      # cron: it pulls this committed catalog.json from raw.githubusercontent
      # and runs `sync_to_woo.py --apply --changed-only --prune`. See VPS.md.

      - name: Notify Telegram on failure
        # Self-skips when secrets aren't set, so this can land before the user
        # finishes wiring the bot. Once TG_BOT_TOKEN+TG_CHAT_ID exist as repo
        # secrets, any failed run (uAPI 5xx, sanity check trip, token expiry…)
        # pings the chat with a link to the failed run.
        if: ${{ failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="🚨 *BOS·MINI catalog sync FAILED*%0A%0ARepo: ${GITHUB_REPOSITORY}%0ARun: ${RUN_URL}"
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${text}"
