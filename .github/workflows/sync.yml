name: Sync catalog from uCoz uAPI

on:
  schedule:
    # Off-the-hour offsets (:03,:13,:23…) — GitHub deprioritises schedule events
    # at :00,:10,:20 under peak load and silently skips them. This is a fallback;
    # primary trigger is a Supabase pg_cron job that hits workflow_dispatch.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install --quiet httpx

      - name: Snapshot previous count
        id: prev
        run: |
          # Read scraped_count from the committed catalog (HEAD) before we
          # overwrite the file. Empty string if catalog.json doesn't exist yet.
          if [ -f catalog.json ]; then
            old=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
          else
            old=""
          fi
          echo "old=$old" >> "$GITHUB_OUTPUT"

      - name: Pull catalog
        env:
          UCOZ_SITE: bosminiofficial.com
          UCOZ_TOKEN: ${{ secrets.UCOZ_TOKEN }}
        run: |
          if [ -z "$UCOZ_TOKEN" ]; then
            echo "::error::UCOZ_TOKEN secret is not set"
            exit 1
          fi
          # Retry to ride out transient uAPI 5xx / network blips before paging
          # the operator. Telegram alert fires only after all 3 attempts fail.
          for attempt in 1 2 3; do
            if python sync_catalog.py --out catalog.json; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::sync_catalog.py failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 20s…"
            sleep 20
          done

      - name: Sanity check (count not collapsed)
        env:
          OLD: ${{ steps.prev.outputs.old }}
          MIN_RATIO: "0.8"
        run: |
          new=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
          echo "Previous count: ${OLD:-<none>}"
          echo "New count:      $new"
          if [ -z "$OLD" ]; then
            echo "First run — nothing to compare. Accepting."
            exit 0
          fi
          # Refuse to publish if the catalog shrank below MIN_RATIO of the prior
          # snapshot. Guards against partial uAPI failures (one category 5xx'd
          # mid-fetch) leaving us with a half-empty feed in production.
          python - <<PY
          import os, sys
          old = int(os.environ["OLD"])
          new = $new
          ratio = float(os.environ["MIN_RATIO"])
          if old > 0 and new < old * ratio:
              print(f"::error::Catalog collapsed: {new} < {old} * {ratio} ({int(old*ratio)}). Refusing to commit.")
              sys.exit(1)
          print(f"OK — {new} >= {int(old*ratio)} (floor at {ratio:.0%} of previous).")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain catalog.json)" ]; then
            count=$(python -c "import json; print(json.load(open('catalog.json'))['scraped_count'])")
            git add catalog.json
            git commit -m "Auto-sync catalog (${count} products)"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::git push failed after 3 attempts"
                exit 1
              fi
              echo "Push attempt $attempt failed, retrying in 10s…"
              sleep 10
            done
            echo "Committed update."
          else
            echo "No changes — catalog already up to date."
          fi

      - name: Trigger Supabase sync-catalog
        # Chained off the back of the workflow (not pg_cron) so the Edge
        # Function always reads the catalog.json we just committed, not a
        # stale copy from before this run. Access is gated by the shared
        # X-Sync-Secret header (verify_jwt is off on the function) — the repo
        # secret must equal the function's SYNC_SECRET env.
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS -X POST \
                "https://bjcqaltwlblzqdkdujlu.supabase.co/functions/v1/sync-catalog" \
                -H "Content-Type: application/json" \
                -H "X-Sync-Secret: ${SYNC_SECRET}" \
                -d '{}'; then
              echo
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::sync-catalog Edge Function failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 10s…"
            sleep 10
          done

      # NOTE: the .ru WooCommerce mirror is NOT done here. reg.ru drops TCP
      # connections from GitHub's runner IPs (httpx.ConnectTimeout) — the same
      # block that forced the Timeweb VPS proxy in front of Supabase. So the
      # push runs from the Timeweb VPS (5.42.117.161, Russian IP) on its own
      # cron: it pulls this committed catalog.json from raw.githubusercontent
      # and runs `sync_to_woo.py --apply --changed-only --prune`. See VPS.md.

      - name: Notify Telegram on failure
        # Self-skips when secrets aren't set, so this can land before the user
        # finishes wiring the bot. Once TG_BOT_TOKEN+TG_CHAT_ID exist as repo
        # secrets, any failed run (uAPI 5xx, sanity check trip, token expiry…)
        # pings the chat with a link to the failed run.
        if: ${{ failure() && env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="🚨 *BOS·MINI catalog sync FAILED*%0A%0ARepo: ${GITHUB_REPOSITORY}%0ARun: ${RUN_URL}"
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=${text}"
